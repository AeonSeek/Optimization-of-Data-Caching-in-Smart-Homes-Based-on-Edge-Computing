<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>智能家居系统 - 登录</title>
        <!-- <link rel="stylesheet" href="../css/style.css"> REMOVED -->
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/layout.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/responsive.css" />
        <!-- 可以考虑引入图标库，例如 Font Awesome -->
        <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->
    </head>
    <body data-page="login">
        <div class="content-wrapper">
            <div class="login-container">
                <div class="logo-area">
                    <!-- 在这里放置 Logo 图片或图标 -->
                    <span class="logo-placeholder">🏠</span>
                    <!-- 暂用 Emoji 作为占位符 -->
                </div>
                <h1>智能家居系统</h1>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            placeholder="请输入用户名"
                        />
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="请输入密码"
                        />
                    </div>
                    <button type="submit">登录</button>
                    <p id="error-message" class="error-message"></p>
                    <div class="form-links">
                        <a href="register.html">注册账号</a>
                        <span>|</span>
                        <a href="forgot_password.html">忘记密码</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- <footer id="app-footer"></footer> Removed Footer Placeholder -->

        <script src="../js/theme.js"></script>
        <script src="../js/sharedComponents.js"></script>
        <script src="../js/login.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // insertFooter(); // Removed Footer Insertion Call
            });
        </script>
    </body>
</html>
