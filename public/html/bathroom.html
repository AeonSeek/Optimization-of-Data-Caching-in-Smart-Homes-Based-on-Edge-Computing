<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>智能家居系统 - 卫生间</title>
        <!-- <link rel="stylesheet" href="../css/style.css"> REMOVED -->
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/layout.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/responsive.css" />
    </head>
    <body data-scene="bathroom">
        <!-- 標識為廁所 -->
        <div id="header-placeholder"></div>
        <!-- Header Placeholder -->

        <div class="content-wrapper">
            <main>
                <div class="scene-content-container main-content-area">
                    <!-- Added main-content-area class -->
                    <h1 id="scene-title">卫生间</h1>

                    <!-- 场景特定模式按钮 -->
                    <div class="scene-modes-area">
                        <h3 class="section-subtitle">场景模式</h3>
                        <div class="scene-modes-grid">
                            <button class="scene-mode-button" data-mode="relax">放松</button>
                            <button class="scene-mode-button" data-mode="cleaning">清洁</button>
                            <!-- 卫生间示例场景模式按钮 -->
                        </div>
                    </div>

                    <div id="device-list" class="device-list">
                        <!-- JS 會載入設備，結構會類似下方 -->
                        <!-- 
                    <div class="device">
                        <div class="device-icon"><span>💡</span></div> 
                        <div class="device-info">
                            <h3>設備名稱</h3>
                            <p class="device-status">狀態/關鍵數據</p> 
                        </div>
                        <div class="device-details"> 
                            <p>詳細數據...</p>
                            <p class="last-updated"><small>更新時間</small></p>
                        </div>
                    </div> 
                    -->
                        <p>正在加载设备数据...</p>
                    </div>
                    <a href="index.html"
                        ><button id="back-button">返回主界面</button></a
                    >
                </div>
            </main>
        </div>

        <!-- Template for Device Card -->
        <template id="device-card-template">
            <div class="device">
                <div class="device-icon"><span></span></div>
                <div class="device-info">
                    <h3></h3>
                    <p class="device-status"></p>
                </div>
                <div class="device-details">
                    <!-- Details will be added here -->
                    <p class="last-updated">
                        <small>更新: <span></span></small>
                    </p>
                </div>
            </div>
        </template>

        <footer id="app-footer"></footer>

        <script src="../js/theme.js"></script>
        <!-- 引用主題切換 JS -->
        <script src="../js/sharedComponents.js"></script>
        <!-- Shared components loader -->
        <script src="../js/scene.js"></script>
        <script>
            // Insert the header after DOM is ready and scripts are loaded
            document.addEventListener('DOMContentLoaded', () => {
                insertHeader();
                insertFooter();
            });
        </script>
    </body>
</html>
