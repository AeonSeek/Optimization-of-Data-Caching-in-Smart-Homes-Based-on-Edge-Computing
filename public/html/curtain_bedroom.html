<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卧室窗帘 - 智能家居控制</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/device_control.css" />
</head>
<body data-device-type="curtain" data-scene="bedroom">
    <div id="header-placeholder"></div>

    <div class="content-wrapper">
        <main>
            <div class="device-control-container main-content-area">
                <div class="control-header">
                    <h1 id="device-name">卧室窗帘</h1>
                    <a href="bedroom.html" class="back-link">&larr; 返回卧室</a>
                </div>

                <div class="control-layout">
                    <!-- 左侧：控制面板 -->
                    <div class="control-panel">
                        <h2>控制</h2>
                        <div class="control-group">
                            <label>基本操作:</label>
                            <div class="button-group" style="display: flex; gap: 10px; justify-self: start;">
                                <button id="open-button" class="control-button">打开</button>
                                <button id="close-button" class="control-button">关闭</button>
                                <button id="stop-button" class="control-button">停止</button>
                            </div>
                        </div>
                         <div class="control-group">
                            <label for="position-slider">位置 (%):</label>
                            <input type="range" id="position-slider" min="0" max="100" step="1" class="control-slider">
                            <span id="position-value" class="slider-value">--</span>
                        </div>
                         <span id="control-status" class="status-indicator" style="grid-column: 2 / span 2; text-align: left; margin-top: -10px;"></span>
                    </div>

                    <!-- 右侧：状态显示 -->
                    <div class="status-and-chart">
                        <h2>状态</h2>
                         <div class="status-display">
                            <p><span>当前状态:</span> <span id="curtain-status">未知</span></p>
                            <p><span>当前位置:</span> <span id="current-position">--</span> %</p>
                            <p class="last-updated"><small>最后更新: <span id="last-updated-time">--</span></small></p>
                         </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <footer id="app-footer"></footer>

    <script src="../js/theme.js"></script>
    <script src="../js/sharedComponents.js"></script>
    <script src="../js/device_control_curtain.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            insertHeader();
            insertFooter();
            if (typeof initializeCurtainControl === 'function') {
                initializeCurtainControl();
            } else {
                 console.error('initializeCurtainControl function not found.');
                 const mainContent = document.querySelector('.device-control-container');
                 if(mainContent) {
                    mainContent.innerHTML = '<p style="color: red;">页面脚本加载失败，无法控制设备。</p>' + mainContent.innerHTML;
                 }
            }
        });
    </script>
</body>
</html>
