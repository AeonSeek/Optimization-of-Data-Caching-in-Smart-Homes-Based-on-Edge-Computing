<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能家居系统 - 忘记密码</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body data-page="forgot-password">
    <div class="content-wrapper">
        <div class="login-container forgot-password-container">
            <div class="logo-area">
                <span class="logo-placeholder">🏠</span>
            </div>
            <h1>忘记密码</h1>
            <form id="forgot-password-form">
                <p>请输入您的用户名或电子邮件地址，我们将发送密码重设指示给您。</p>
                <div class="form-group">
                    <label for="identifier">用户名或邮箱</label>
                    <input type="text" id="identifier" name="identifier" required placeholder="输入用户名或邮箱" />
                </div>
                <button type="submit">发送重设指示</button>
                <p id="message" class="info-message"></p>
                <p class="form-links"><a href="login.html">返回登录</a></p>
            </form>
        </div>
    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/forgot_password.js"></script>
</body>
</html>
